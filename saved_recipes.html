<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saved Recipes - Recipe Box</title>
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/saved_recipes.css" />
    <link rel="stylesheet" href="css/recipe_cards.css" />
    <script src="js/script.js" defer></script>
    <script src="js/saved_recipes.js" defer></script>
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">
          <a href="index.html" class="logo-link">
            <img src="images/logo.png" alt="Logo" />
          </a>
        </div>
        <div class="navlinks">
          <a href="index.html" class="navlink">Browse</a>
          <a href="saved_recipes.html" class="navlink active">Saved Recipes</a>
          <a href="planner.html" class="navlink">Weekly Planner</a>
          <a href="shopping_list.html" class="navlink">Shopping List</a>
          <a href="settings.html" class="navlink">Settings</a>
        </div>
      </nav>
    </header>

    <main>
      <h1 id="saved-recipes-title">Saved Recipes</h1>
      <section id="saved-recipes-container">
        <!-- Saved recipes will be dynamically inserted here -->
      </section>

      <dialog id="planner-dialog">
        <form method="dialog" class="dialog-form">
          <h2 id="planner-dialog-title">Add to Planner</h2>
          <label for="meal-type-select">Select Meal Type:</label>
          <select id="meal-type-select" name="meal-type" required>
            <option value="breakfast">Breakfast</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
          </select>
          <br>
          <label for="day-select">Select Day:</label>
          <select id="day-select" name="day-select" required>
            <option value="Monday" selected>Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
          </select>
          <div class="dialog-buttons">
            <button type="submit" class="primary">Add</button>
            <button
              type="button"
              class="warning"
              id="planner-dialog-cancel"
            >
              Cancel
            </button>
          </div>
        </form>
      </dialog>
    </main>

    <footer>
      <p>
        &copy; <span id="footer-year"></span> Recipe Box. All rights reserved.
      </p>
      <p class="small">
        Have a feedback? You can <a href="feedback.html">send it here</a>.
      </p>
    </footer>
  </body>
</html>
